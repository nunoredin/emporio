<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consequências da exposição EMPORIO</title>
<style>
  html, body { margin: 0; background: #fff; color: #000; height: 100%; }
  body { font-family: Cambria, "Cambria Math", Georgia, "Times New Roman", serif; display: flex; flex-direction: column; }
  main { width: 100%; max-width: 1400px; margin: 0 auto; padding: 40px 16px 0; box-sizing: border-box; flex: none; }
  /* Scroll horizontal em loop: uma fila de imagens, sem espaço entre elas */
  .scroller { flex: 1; min-height: 150px; display: flex; align-items: center; overflow: hidden; }
  .track { display: flex; width: max-content; animation: deslizar var(--dur, 60s) linear infinite; }
  .block { display: flex; }
  .block figure { margin: 0; display: flex; flex-direction: column; }
  .block img { display: block; height: 150px; width: auto; }
  .block figcaption { width: 0; min-width: 100%; box-sizing: border-box; padding: 6px 6px 0; font-size: 11px; line-height: 1.3; font-style: italic; }
  @keyframes deslizar { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  svg { display: block; width: 100%; height: auto; }
  svg text { fill: #000; font-size: 15px; }
  .i { font-style: italic; }
  .guide { stroke: #000; stroke-width: 0.8; stroke-dasharray: 2 3; }
</style>
</head>
<body>
<main>
<svg viewBox="0 0 1100 540" role="img" aria-label="Gráfico de incidentes em edifícios de Lisboa após 23.05.2026">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="110" y1="440" x2="1010" y2="440" stroke="#000" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="110" y1="440" x2="110" y2="40" stroke="#000" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="40" y="28" class="i" style="font-size:18px">Incidentes</text>
  <text x="1028" y="446" class="i" style="font-size:18px">Data</text>

  <!-- Y ticks -->
  <g text-anchor="end">
    <line x1="104" y1="380" x2="116" y2="380" stroke="#000" stroke-width="1.5"/><text x="96" y="385">2</text>
    <line x1="104" y1="320" x2="116" y2="320" stroke="#000" stroke-width="1.5"/><text x="96" y="325">4</text>
    <line x1="104" y1="260" x2="116" y2="260" stroke="#000" stroke-width="1.5"/><text x="96" y="265">6</text>
    <line x1="104" y1="200" x2="116" y2="200" stroke="#000" stroke-width="1.5"/><text x="96" y="205">8</text>
    <line x1="104" y1="140" x2="116" y2="140" stroke="#000" stroke-width="1.5"/><text x="96" y="145">10</text>
    <line x1="104" y1="80"  x2="116" y2="80"  stroke="#000" stroke-width="1.5"/><text x="96" y="85">12</text>
  </g>

  <!-- 23.05.2026 -->
  <text x="361.5" y="26" text-anchor="middle" class="i" style="font-size:20px">Inauguração do Emporio</text>
  <line x1="361.5" y1="40" x2="361.5" y2="500" stroke="#000" stroke-width="3"/>
  <text x="361.5" y="526" text-anchor="middle" style="font-size:24px;font-weight:700">23.05.2026</text>

  <!-- Dois meses antes -->
  <text x="110" y="466" text-anchor="middle" style="font-size:13px">23.03</text>
  <text x="236" y="428" text-anchor="middle" class="i">sem registos</text>

  <g id="plot"></g>
</svg>
</main>

<div class="scroller"><div class="track" id="track"></div></div>

<script>
  // [data fictícia, local]
  const EVENTS = [
    ["29.05", "Rodrigues Sampaio"],
    ["14.06", "Alcântara"],
    ["03.07", "Graça"],
    ["15.07", "paredes mestras"],
    ["27.07", "Possidónio da Silva"],
    ["08.08", "Conde Redondo"],
    ["24.08", "Oeiras Parque"],
    ["02.09", "Febo Moniz"],
    ["11.09", "café histórico"],
    ["21.09", "Santa Bárbara"],
    ["01.10", "Rua Nova do Carvalho"],
    ["15.10", "São João da Praça"],
  ];
  const NS = "http://www.w3.org/2000/svg";
  const g = document.getElementById("plot");
  const X0 = 110, Y0 = 440, PX_DAY = 870 / 211, PX_N = 30;
  const start = Date.UTC(2026, 2, 23);
  const days = s => { const [d, m] = s.split(".").map(Number); return (Date.UTC(2026, m - 1, d) - start) / 864e5; };
  const add = (tag, a, txt) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); if (txt) n.textContent = txt; g.appendChild(n); };

  const pts = [[X0, Y0], [X0 + days("23.05") * PX_DAY, Y0]];
  const yTop = Y0 - EVENTS.length * PX_N;
  add("line", { x1: X0, y1: yTop, x2: X0 + days(EVENTS[EVENTS.length - 1][0]) * PX_DAY, y2: yTop, class: "guide" });
  EVENTS.forEach(([date, place], i) => {
    const x = X0 + days(date) * PX_DAY, y = Y0 - (i + 1) * PX_N;
    pts.push([x, y]);
    add("line", { x1: x, y1: y - 34, x2: x, y2: Y0, class: "guide" });
    add("line", { x1: x, y1: Y0 - 6, x2: x, y2: Y0 + 6, stroke: "#000", "stroke-width": 1.5 });
    add("text", { x, y: Y0 + 26, "text-anchor": "middle", style: "font-size:13px" }, date);
    // Morada por cima da linha de data; nomes com mais de uma palavra em 2 linhas
    const words = place.split(" ");
    let cut = 1, best = Infinity;
    for (let k = 1; k < words.length; k++) {
      const diff = Math.abs(words.slice(0, k).join(" ").length - words.slice(k).join(" ").length);
      if (diff < best) { best = diff; cut = k; }
    }
    const lines = words.length > 1 ? [words.slice(0, cut).join(" "), words.slice(cut).join(" ")] : [place];
    const cx = i === 0 ? x + 8 : x; // afasta o primeiro da linha de 23.05
    lines.forEach((ln, k) => add("text", { x: cx, y: y - 40 - 14 * (lines.length - 1 - k), "text-anchor": "middle", class: "i", style: "font-size:12px;stroke:#fff;stroke-width:4px;paint-order:stroke;stroke-linejoin:round" }, ln));
  });

  add("polyline", { points: pts.map(p => p.join(",")).join(" "), fill: "none", stroke: "#000", "stroke-width": 1.5 });

  // Imagens da pasta, repetidas em dois blocos iguais para o loop não ter salto
  const IMAGES = ["002","003","004","005","006","007","008","009","010","011","012","013","014","015","016","017","018","019","020","021","022","023","024","025","026","027","028","029","030","039","040","042","043","044"].map(n => n + "sr.jpeg");
  const MORADAS = {
    "Rodrigues Sampaio": "Rua Rodrigues Sampaio",
    "Graça": "Rua do Sol à Graça",
    "paredes mestras": "Lisboa",
    "Possidónio da Silva": "Rua Possidónio da Silva",
    "Conde Redondo": "Rua do Conde Redondo",
    "Febo Moniz": "Rua Febo Moniz",
    "café histórico": "Baixa, Lisboa",
    "Santa Bárbara": "Largo de Santa Bárbara",
    "São João da Praça": "Rua de São João da Praça, Alfama",
  };
  const track = document.getElementById("track");
  for (let k = 0; k < 2; k++) {
    const block = document.createElement("div");
    block.className = "block";
    if (k) block.setAttribute("aria-hidden", "true");
    block.innerHTML = IMAGES.map((src, i) => {
      const [date, place] = EVENTS[(i * 5) % EVENTS.length];
      const addr = MORADAS[place] || place;
      return `<figure><img src="${src}" alt=""><figcaption>${addr}<br>${date}.2026</figcaption></figure>`;
    }).join("");
    track.appendChild(block);
  }
  // Velocidade constante: ~40 px por segundo
  window.addEventListener("load", () => {
    track.style.setProperty("--dur", (track.firstChild.offsetWidth / 40) + "s");
  });
</script>
</body>
</html>
